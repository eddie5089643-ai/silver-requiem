<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>銀刃安魂曲 Silver Requiem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
html,body{margin:0;height:100%;background:#050507;overflow:hidden}
canvas{display:block;margin:0 auto;cursor:none}
#mob{display:none;position:fixed;inset:0;pointer-events:none;font-family:system-ui,"PingFang TC","Microsoft JhengHei",sans-serif;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#mob.on{display:block}
#mob .pad{position:absolute;width:196px;height:120px;pointer-events:none}
#mob .joy{position:absolute;left:0;top:0;width:120px;height:120px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:radial-gradient(circle,rgba(40,36,64,.35),rgba(20,18,32,.55));pointer-events:auto;touch-action:none}
#mob .knob{position:absolute;left:36px;top:36px;width:48px;height:48px;border-radius:50%;background:rgba(207,224,255,.4);border:1px solid rgba(255,255,255,.7);pointer-events:none}
#mob .joy.dn .knob{background:rgba(207,224,255,.65)}
#mob .k{position:absolute;width:44px;height:44px;border:1px solid rgba(255,255,255,.35);background:rgba(20,18,32,.45);color:#e8e8f4;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;pointer-events:auto;touch-action:none}
#mob .act{position:absolute;width:150px;height:110px;pointer-events:none}
#mob .act .k{border-radius:50%}
#mob .k.dn{background:rgba(207,224,255,.35);border-color:#fff}
#mob .side{position:absolute;pointer-events:auto;background:rgba(10,10,16,.92);border-left:1px solid #2a2840;color:#ddd;overflow:auto;box-sizing:border-box;padding:8px;touch-action:pan-y}
#mob .side h3{margin:2px 0 6px;font-size:13px;color:#b8a0ff;font-weight:600;letter-spacing:1px}
#mob .row{display:flex;gap:4px;margin:0 0 5px}
#mob .row .q{flex:0 0 30px;border:1px solid #5a5070;background:#221c3a;color:#ffe9a8;border-radius:6px;font-size:14px;padding:0}
#mob .row .q:active{background:#3a3060}
#mob #mobCmds.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));column-gap:6px}
#mob .cmd{display:block;flex:1;min-width:0;margin:0;padding:6px 6px;border:1px solid #3a3658;background:#16142a;color:#fff;border-radius:6px;text-align:left;font-size:12px;line-height:1.25}
#mob .cmd b{color:#ffe9a8;font-weight:600;font-family:ui-monospace,monospace}
#mob .cmd span{display:block;color:#9a98b0;font-size:10.5px}
#mob .cmd:active{background:#2a2650}
#mob .type{position:absolute;pointer-events:auto;touch-action:none;width:68px;height:38px;white-space:nowrap;padding:0;border-radius:10px;border:1px solid rgba(255,233,168,.6);background:rgba(20,18,32,.6);color:#ffe9a8;font-size:14px}
#mob .inbar{position:absolute;left:0;right:0;bottom:0;display:none;pointer-events:auto;background:rgba(5,5,10,.95);padding:6px;gap:6px;box-sizing:border-box}

#mob .inbar button{font-size:14px;padding:0 14px;border-radius:6px;border:1px solid #777;background:#222;color:#fff}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="mob">
  <div class="pad" id="mobPad">
    <div class="joy" id="mobJoy"><div class="knob" id="mobKnob"></div></div>
    <div class="k" data-d="dash" style="left:142px;top:66px;width:52px;height:52px;border-radius:50%;font-size:13px;border-color:rgba(159,232,255,.7)">閃避</div>
  </div>
  <div class="act" id="mobAct">
    <div class="k" data-a="atk" style="left:86px;top:42px;width:62px;height:62px;font-size:14px">攻擊</div>
    <div class="k" data-a="parry" style="left:24px;top:56px;width:52px;height:52px;font-size:13px;border-color:rgba(255,233,168,.6)">振刀</div>
    <div class="k" data-a="ok" style="left:30px;top:2px;width:44px;height:30px;font-size:11px;border-radius:8px">確認</div>
    <div class="k" data-a="swap" style="left:96px;top:-8px;width:44px;height:44px;font-size:11px;line-height:1.1;text-align:center">切換<br>武器</div>
  </div>
  <button class="type" id="mobType">⌨ 打字</button>
  <div class="side" id="mobSide"><h3>指令列表</h3><div id="mobCmds"></div></div>
  <div class="inbar" id="mobBar"><input id="mobIn" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="輸入 / 開頭的指令或聊天"><button id="mobGo">送出</button></div>
</div>
<script>
'use strict';
try{document.fonts&&document.fonts.load('40px "UnifrakturMaguntia"');}catch(e){}
// =====================================================================
//  銀刃安魂曲 Silver Requiem — v2
//  大地圖 Boss 戰 · 像素骨架角色 · 振刀架勢 · 程序生成交響合唱
// =====================================================================
const W=800,H=450,WW=3600,WH=1200,GROUND=1100,TOX=(W-640)/2,TOY=(H-360)/2;
const cv=document.getElementById('c'),cx=cv.getContext('2d');
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
const buf=mk(W,H),g=buf.getContext('2d');
const glw=mk(W,H),gg=glw.getContext('2d');
const bl1=mk(Math.round(W/4),Math.round(H/4)),b1=bl1.getContext('2d');
const bl2=mk(Math.round(W/8),Math.round(H/8)),b2=bl2.getContext('2d');
let S=2;
let MOB=matchMedia('(pointer:coarse)').matches||/mobile/i.test(location.search+location.hash);
const MOB_PW=170,MOB_PH=250;
function resize(){let aw=innerWidth,ah=innerHeight;const land=aw>=ah;if(MOB){if(land)aw-=MOB_PW;else ah-=MOB_PH;}
  const s=Math.min(aw/W,ah/H);S=s;
  cv.width=Math.round(W*S);cv.height=Math.round(H*S);
  if(MOB){cv.style.position='absolute';cv.style.margin='0';cv.style.left=Math.round((aw-cv.width)/2)+'px';cv.style.top=Math.round(land?(ah-cv.height)/2:0)+'px';}
  else{cv.style.position='';cv.style.left=cv.style.top='';cv.style.margin='0 auto';cv.style.marginTop=Math.max(0,(innerHeight-cv.height)/2)+'px';}
  if(window.mobLayout)mobLayout();}
addEventListener('resize',resize);document.addEventListener('fullscreenchange',resize);resize();
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2;
const dist=(ax,ay,bx,by)=>Math.hypot(bx-ax,by-ay);
const angDiff=(a,b)=>{let d=(b-a)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d;};
const ease=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
const easeOut=k=>1-Math.pow(1-k,3);
function ptSeg(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;let t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=clamp(t,0,1);return Math.hypot(px-ax-dx*t,py-ay-dy*t);}
function segDist(a,b,c,d){
  const cr=(o,p,q)=>(p[0]-o[0])*(q[1]-o[1])-(p[1]-o[1])*(q[0]-o[0]);
  const d1=cr(c,d,a),d2=cr(c,d,b),d3=cr(a,b,c),d4=cr(a,b,d);
  if(((d1>0&&d2<0)||(d1<0&&d2>0))&&((d3>0&&d4<0)||(d3<0&&d4>0)))return 0;
  return Math.min(ptSeg(a[0],a[1],c[0],c[1],d[0],d[1]),ptSeg(b[0],b[1],c[0],c[1],d[0],d[1]),ptSeg(c[0],c[1],a[0],a[1],b[0],b[1]),ptSeg(d[0],d[1],a[0],a[1],b[0],b[1]));
}

// ---------------- 輸入 ----------------
const keys={},pressed={};
const chat={open:false,text:'',log:[]};let godMode=false,aimbot=false,noPotCD=false;
function chatSay(t){chat.log.push({t,life:420});if(chat.log.length>6)chat.log.shift();}
function runCmd(line){
  const [cmd,...args]=line.slice(1).trim().split(/\s+/);const c=(cmd||'').toLowerCase();
  if(c==='god'){godMode=!godMode;chatSay('無敵模式：'+(godMode?'開':'關'));}
  else if(c==='aimbot'){aimbot=!aimbot;chatSay('自動瞄準：'+(aimbot?'開':'關'));}
  else if(c==='heal'){if(P){P.hp=P.mhp;chatSay('生命已補滿');}}
  else if(c==='phase'){const n=parseInt(args[0])-1;if(boss&&!boss.dead&&n>=0&&n<=3){if(boss.dormant){mirror.force=true;updMirror();}boss.hp=Math.min(boss.hp,boss.mhp*(n===0?1:boss.phaseAt[n-1]-.01));chatSay('跳到第 '+(n+1)+' 階段');}else chatSay('用法：/phase 1~4');}
  else if(c==='kill'){if(boss&&!boss.dead&&state==='fight'){if(boss.dormant){mirror.force=true;updMirror();}const b=boss;
      if(b.last){b.lt=LAST_T;chatSay('跳過最終招');}else{b.inv=0;b.trans=0;if(b.phase<3){b.phase=3;b.ai=0;b.t=0;setMusic(b.song,3+(b.off||0));}dmgBoss(Math.ceil(b.hp)+1,b.x,b.y-24,true);chatSay(b.last?'Boss 血條已清空，進入最終招':'Boss 血條已清空');}}else chatSay('目前沒有可清空的 Boss');}
  else if(c==='rage'){if(P&&state==='fight'){if(P.rageOn)P.rage=100;else rageStart();chatSay('怒氣已回滿');}else chatSay('請先進入戰鬥');}
  else if(c==='potion'){noPotCD=!noPotCD;if(noPotCD&&P)P.potCD=0;chatSay('補血藥水無冷卻：'+(noPotCD?'開':'關'));}
  else if(c==='mobile'){MOB=!MOB;resize();chatSay('手機介面：'+(MOB?'開':'關'));}
  else if(c==='help'){chatSay('/god 無敵  /aimbot 自動瞄準  /heal 補滿');chatSay('/kill 清空Boss血條  /rage 回滿怒氣  /potion 藥水無冷卻');chatSay('/phase 1~4 跳階段  /mobile 手機介面');}
  else chatSay('未知指令：/'+(cmd||''));
}
addEventListener('keydown',e=>{
  if(e.target&&e.target.id==='mobIn')return;
  if(chat.open){e.preventDefault();
    if(e.key==='Enter'){const t=chat.text.trim();if(t.startsWith('/'))runCmd(t);else if(t)chatSay(t);chat.open=false;chat.text='';}
    else if(e.key==='Escape'){chat.open=false;chat.text='';}
    else if(e.key==='Backspace')chat.text=chat.text.slice(0,-1);
    else if(e.key.length===1&&chat.text.length<40)chat.text+=e.key;
    return;}
  if(e.key.toLowerCase()==='t'&&state==='fight'&&!paused){chat.open=true;chat.text='';for(const k in keys)keys[k]=false;mouse.l=mouse.r=false;e.preventDefault();return;}
  const k=e.key.toLowerCase();if(!keys[k])pressed[k]=true;keys[k]=true;
  if([' ','arrowup','arrowdown','arrowleft','arrowright','tab'].includes(k))e.preventDefault();audioInit();});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;mouse.l=mouse.r=false;});
const mouse={x:W/2,y:H/2,l:false,r:false,lp:false,rp:false};window.__m=mouse;
function mpos(e){const r=cv.getBoundingClientRect();mouse.x=(e.clientX-r.left)/r.width*W;mouse.y=(e.clientY-r.top)/r.height*H;}
cv.addEventListener('mousemove',mpos);
function toggleFS(){try{const d=document;if(!d.fullscreenElement&&!d.webkitFullscreenElement){const el=d.documentElement;(el.requestFullscreen||el.webkitRequestFullscreen).call(el).catch?.(()=>{fsFail=180;});}else{(d.exitFullscreen||d.webkitExitFullscreen).call(d);}}catch(err){fsFail=180;}}
let fsFail=0;const FSB={x:6,y:6,w:16,h:16};
cv.addEventListener('mousedown',e=>{mpos(e);audioInit();if(e.button===0&&mouse.x>FSB.x&&mouse.x<FSB.x+FSB.w&&mouse.y>FSB.y&&mouse.y<FSB.y+FSB.h){toggleFS();return;}if(e.button===0){mouse.l=true;mouse.lp=true;}if(e.button===2){mouse.r=true;mouse.rp=true;}});
addEventListener('mouseup',e=>{if(e.button===0)mouse.l=false;if(e.button===2)mouse.r=false;});
cv.addEventListener('contextmenu',e=>e.preventDefault());

// =====================================================================
//  音訊：程序生成管弦樂 + 阿卡貝拉合唱
// =====================================================================
let AC=null,master,comp,rev,musicBus,sfxBus,noiseBuf,customGain;
function impulse(sec,decay,pre){
  const len=AC.sampleRate*sec,p=Math.floor(AC.sampleRate*(pre||0)),b=AC.createBuffer(2,len,AC.sampleRate);
  for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=p;i<len;i++){const k=(i-p)/(len-p);d[i]=(Math.random()*2-1)*Math.pow(1-k,decay)*(1-Math.exp(-(i-p)/600));}}
  return b;
}
function audioInit(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;return;}
  master=AC.createGain();master.gain.value=.9;master.connect(AC.destination);
  comp=AC.createDynamicsCompressor();comp.threshold.value=-16;comp.knee.value=12;comp.ratio.value=5;comp.attack.value=.01;comp.release.value=.3;comp.connect(master);
  rev=AC.createConvolver();rev.buffer=impulse(4.2,2.6,.03);
  const rg=AC.createGain();rg.gain.value=.42;rev.connect(rg);rg.connect(comp);
  musicBus=AC.createGain();musicBus.gain.value=music.on?.55:0;
  const mDry=AC.createGain();mDry.gain.value=.75;musicBus.connect(mDry);mDry.connect(comp);musicBus.connect(rev);
  sfxBus=AC.createGain();sfxBus.gain.value=.6;sfxBus.connect(comp);
  const sr=AC.createGain();sr.gain.value=.18;sfxBus.connect(sr);sr.connect(rev);
  customGain=AC.createGain();customGain.gain.value=music.on?.8:0;customGain.connect(comp);
  noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);
  const nd=noiseBuf.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  music.nextT=AC.currentTime+.1;if(!music.want)music.want={song:music.song,sec:music.sec};music.bus=null;
  smpLoad();
}
// ---- 真實採樣配樂：music/t0~t5.mp3，切換時淡入淡出交疊 ----
const SMP={buf:[],cur:null,want:-1,mute:false,FADE:1.6,FILES:['music/t0.mp3','music/t1.mp3','music/t2.mp3','music/t3.mp3','music/t4.mp3','music/t5.mp3']};
function smpLoad(){if(SMP.loading)return;SMP.loading=true;
  SMP.FILES.forEach((f,i)=>{fetch(f).then(r=>{if(!r.ok)throw 0;return r.arrayBuffer();}).then(ab=>AC.decodeAudioData(ab)).then(b=>{SMP.buf[i]=b;}).catch(()=>{});});}
function smpTrack(){if(music.song==='title')return 0;const m=/^mirror_(\d)$/.exec(music.song);if(!m)return -1;const k=+m[1]+1;if(boss&&boss.dead&&SMP.cur)return SMP.cur.id;return (k===4&&boss&&boss.last)?5:k;}
function smpFadeOut(c,T){if(!c)return;const g=c.g.gain;g.cancelScheduledValues(AC.currentTime);g.setValueAtTime(g.value,AC.currentTime);g.linearRampToValueAtTime(0,AC.currentTime+T);try{c.src.stop(AC.currentTime+T+.05);}catch(e){}}
function smpUpdate(){ // 回傳 true 表示由採樣配樂負責播放
  const id=smpTrack();if(id<0||!SMP.buf[id])return SMP.cur&&SMP.cur.id===id;
  if(SMP.cur&&SMP.cur.id===id)return true;
  const now=AC.currentTime,b=SMP.buf[id];let off=0;
  // 第四階段→最後謝幕：依目前播放時間對齊切換
  if(SMP.cur&&SMP.cur.id===4&&id===5){const d4=SMP.buf[4].duration,p4=(now-SMP.cur.t0)%d4;off=(p4>=60?89:p4)%b.duration;}
  smpFadeOut(SMP.cur,SMP.FADE);
  const src=AC.createBufferSource();src.buffer=b;src.loop=true;const g=AC.createGain();g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(SMP.mute?0:.75,now+SMP.FADE);
  src.connect(g);g.connect(customGain);src.start(now,off);SMP.cur={id,src,g,t0:now-off};SMP.mute=false;
  if(music.bus){const ob=music.bus;ob.gain.cancelScheduledValues(now);ob.gain.setValueAtTime(ob.gain.value,now);ob.gain.linearRampToValueAtTime(.0001,now+SMP.FADE);}
  return true;}
const mtof=m=>440*Math.pow(2,(m-69)/12);
function pan(v){if(!AC.createStereoPanner){const gn=AC.createGain();return gn;}const p=AC.createStereoPanner();p.pan.value=v;return p;}
function adsr(gn,t,a,peak,sus,rel,dur){
  gn.gain.setValueAtTime(0.0001,t);gn.gain.linearRampToValueAtTime(peak,t+a);
  gn.gain.setTargetAtTime(peak*sus,t+a,Math.max(.05,dur*.35));
  gn.gain.setTargetAtTime(0.0001,t+dur,rel/3);
}
function lfo(target,t,f,depth,delay,stop){
  const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=f;
  lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(depth,t+delay);
  l.connect(lg);lg.connect(target);l.start(t);l.stop(stop);
}
// ---- 加法合成合唱：依母音共振峰包絡算出每個泛音振幅（PeriodicWave）----
const FORM={a:[[800,110,1],[1150,120,.5],[2900,160,.22],[3900,180,.1]],o:[[450,90,1],[800,100,.42],[2830,140,.09]],u:[[325,70,1],[700,90,.18],[2530,200,.04]],e:[[400,80,1],[1600,110,.32],[2700,150,.22]]};
const waveCache={};
function voiceWave(m,vowel){const key='v'+vowel+Math.round(m);if(waveCache[key])return waveCache[key];
  const f0=mtof(m),n=Math.min(80,Math.floor(9000/f0)),re=new Float32Array(n+1),im=new Float32Array(n+1);
  for(let h=1;h<=n;h++){const f=f0*h;let a=0;for(const [F,Bw,A] of FORM[vowel])a+=A/(1+Math.pow((f-F)/(Bw*1.6),2));im[h]=(a+.01)*Math.pow(h,-.45);}
  return waveCache[key]=AC.createPeriodicWave(re,im);}
// 弦樂：鋸齒頻譜 × 琴身共鳴
function stringWave(m){const key='s'+Math.round(m);if(waveCache[key])return waveCache[key];
  const f0=mtof(m),n=Math.min(90,Math.floor(11000/f0)),re=new Float32Array(n+1),im=new Float32Array(n+1);
  const body=[[290,70,.9],[470,110,.7],[1050,300,.35],[2800,900,.8],[4500,1200,.25]];
  for(let h=1;h<=n;h++){const f=f0*h;let b=.35;for(const [F,Bw,A] of body)b+=A/(1+Math.pow((f-F)/Bw,2));im[h]=b/h;}
  return waveCache[key]=AC.createPeriodicWave(re,im);}
function iChoir(t,m,dur,vel,vowel,n,pv,out){
  t+=rnd(0,.015);vel*=rnd(.9,1.06);
  const fr=mtof(m),stop=t+dur+1.3,gn=AC.createGain(),pn=pan(pv||0);gn.connect(pn);pn.connect(out);
  adsr(gn,t,.38,vel,.95,1.0,dur);
  const w=voiceWave(m,vowel);n=Math.min(n,3);
  const vl=AC.createOscillator(),vg=AC.createGain();vl.frequency.value=rnd(4.8,5.7);vg.gain.setValueAtTime(0,t);vg.gain.linearRampToValueAtTime(fr*.007,t+.5);vl.connect(vg);vl.start(t);vl.stop(stop);
  const og=AC.createGain();og.gain.value=1/Math.sqrt(n);og.connect(gn);
  for(let i=0;i<n;i++){const o=AC.createOscillator();o.setPeriodicWave(w);o.frequency.value=fr;o.detune.value=(i-(n-1)/2)*9+rnd(-3,3);
    vg.connect(o.frequency);o.connect(og);o.start(t+rnd(0,.04));o.stop(stop);}
  const s=AC.createBufferSource();s.buffer=noiseBuf;const bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=FORM[vowel][1][0];bp.Q.value=2.5;
  const ng=AC.createGain();adsr(ng,t,.25,vel*.07,.5,.6,dur);s.connect(bp);bp.connect(ng);ng.connect(pn);s.start(t,Math.random());s.stop(stop);
}
function iStr(t,m,dur,vel,pv,out,att,bright){
  t+=rnd(0,.012);vel*=rnd(.92,1.05);
  const fr=mtof(m),stop=t+dur+1.1,w=stringWave(m);
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.Q.value=.3;lp.frequency.setValueAtTime((bright||2600)*.5,t);lp.frequency.linearRampToValueAtTime(bright||2600,t+Math.min(dur,1.2));

let SAVE={beaten:{}};try{SAVE=JSON.parse(localStorage.getItem('silverRequiem2'))||SAVE;}catch(e){}

function handleInput(){
  if(pressed['m'])toggleMusic();
  if(state==='title')titleInput();
  else if(state==='fight'){if(pressed['escape']||pressed['p'])paused=!paused;if(paused&&pressed['t']){paused=false;toTitle();}}
  else if(state==='dead'){if(endT>40&&(pressed['r']||pressed['enter']))startFight(bossSel);if(pressed['escape'])toTitle();}
  else if(state==='win'){if(endT===1){SAVE.beaten[bossSel+'_'+diffI]=true;saveGame();}
    if(endT>60&&pressed['r'])startFight(bossSel);if(endT>60&&(pressed['enter']||pressed['escape']))toTitle();}
}
let last=performance.now(),acc=0;
function frame(now){
  acc+=Math.min(100,now-last);last=now;
  while(acc>=1000/60){acc-=1000/60;
    handleInput();
    if(state==='dead'||state==='win'){endT++;frameN++;stepMisc();for(const q of bullets){q.x+=q.vx;q.y+=q.vy;q.life-=3;}bullets=bullets.filter(q=>q.life>0);for(const q of pqi){q.x+=Math.cos(q.a)*q.v;q.y+=Math.sin(q.a)*q.v;q.life--;}pqi=pqi.filter(q=>q.life>0);for(const q of pshots){q.x+=q.vx;q.y+=q.vy;q.life--;}pshots=pshots.filter(q=>q.life>0);strikes=[];lasers=lasers.filter(l=>++l.t<l.tele+l.life);if(boss&&boss.dead)runBoss(boss);}
    else if(state==='fight'&&!paused){if(hitstop>0)hitstop--;else{gameAcc+=slowmo>0?.35:1;if(slowmo>0)slowmo--;while(gameAcc>=1){gameAcc-=1;update();}}}
    else frameN++;
    for(const k in pressed)pressed[k]=false;mouse.lp=mouse.rp=false;}
  render();requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

<script>
(function(){

  const joy=document.getElementById('mobJoy'),knob=document.getElementById('mobKnob');let jid=null;
